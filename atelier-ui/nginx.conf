server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 基础安全 header。注意 nginx 的坑：location 里只要写了任何 add_header，
    # 这里的就全部不再继承，所以下面写了 add_header 的 location 要各自重复一遍
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA：所有路径都给 index.html
    # /api 反代（去掉前缀再转给后端）由外层负责，nginx 不参与
    location / {
        index index.html;
        try_files $uri /index.html;
    }

    # 每次都向服务器确认：用户拿到哪个版本只取决于它
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 文件名带内容哈希，内容变了名字就变，可以放心长缓存。
    # 找不到就 404，不回落到 index.html：旧页面要的旧 chunk 已经不在了，
    # 回落会拿到 200 的 HTML，浏览器当成 JS 加载，只报一个看不懂的 MIME 错误
    # Cache-Control 不加 always：只给成功的响应，别让 404 也被缓存一年
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
