# 权限点定义，启动时同步进 permission 表：新增的插入，变化的更新，这里删掉的置为禁用。
# 权限码发布后不要改名，前端和已有的角色分配都靠它；不再需要时把 enabled 改成 false。
permissions:
  - code: user:view
    name: 查看用户
    description: 查看用户列表与详情
    enabled: true
  - code: user:add
    name: 新增用户
    description: 创建新用户
    enabled: true
  - code: user:edit
    name: 编辑用户
    description: 修改用户信息，包括重设密码、启用与禁用
    enabled: true
  - code: user:delete
    name: 删除用户
    description: 删除用户
    enabled: true
  - code: user:assign-role
    name: 分配角色
    description: 设置用户拥有的角色
    enabled: true
  - code: role:view
    name: 查看角色
    description: 查看角色列表与详情
    enabled: true
  - code: role:add
    name: 新增角色
    description: 创建新角色
    enabled: true
  - code: role:edit
    name: 编辑角色
    description: 修改角色信息，包括启用与禁用
    enabled: true
  - code: role:delete
    name: 删除角色
    description: 删除未分配给用户的角色
    enabled: true
  - code: role:assign-permission
    name: 分配权限
    description: 设置角色拥有的权限
    enabled: true
  - code: permission:view
    name: 查看权限
    description: 查看权限列表
    enabled: true
